{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <h1>My tasks</h1>

    <div class="top">
        <a href="{% url 'create_task' %}"><button>Create task</button></a>
        <a href="{% url 'logout' %}"><button>Logout</button></a>
    </div>

    <div class="tasks">
        {% for task in tasks %}
            <div class="task">
                <h3>{{ task.title }}</h3>
                <p>{{ task.caption }}</p>
                <div class="actions">
                    <a class="edit" href="{% url 'update_task' task.id %}">Изменить</a>
                    <a class="delete" href="{% url 'delete_task' task.id %}">Удалить</a>
                </div>
            </div>
        {% empty %}
            <p>Задач пока нет.</p>
        {% endfor %}
    </div>
</body>
</html>
