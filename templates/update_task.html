{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изменить задачу</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <h1>Изменить задачу</h1>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="title" value="{{ task.title }}" placeholder="Название" required>
        <textarea name="caption" placeholder="Описание">{{ task.caption }}</textarea>
        <button type="submit">Сохранить</button>
    </form>

    <a href="{% url 'show_task' %}">← К списку задач</a>
</body>
</html>
