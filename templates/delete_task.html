{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Удалить задачу</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <h1>Удалить задачу?</h1>

    <form method="POST">
        {% csrf_token %}
        <p>Вы точно хотите удалить «{{ task.title }}»?</p>
        <button type="submit" class="danger">Да, удалить</button>
    </form>

    <a href="{% url 'show_task' %}">Отмена</a>
</body>
</html>
